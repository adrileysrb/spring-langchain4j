spring.application.name=langchain
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:h2:mem:pldft;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.h2.console.enabled=true

server.error.include-message=always

# Provedor de LLM (endpoint compativel com a API da OpenAI -- LM Studio por padrao).
# Trocar por Ollama/OpenAI/Azure e so mudar base-url + nomes de modelo: a API langchain4j e a mesma.
llm.base-url=http://127.0.0.1:1234/v1
llm.api-key=lm-studio
llm.default-model=google/gemma-4-e2b
llm.embedding-model=text-embedding-nomic-embed-text-v1.5
llm.timeout=5m
llm.fallback-to-default-model=true
